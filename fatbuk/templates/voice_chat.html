{% extends "base.html" %}
{% block title %}Fatbuk - Voice Chat{% endblock %}

{% block content %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/voice.css') }}">

<div class="voice-container">
    <h2>🔊 Fonebook</h2>
    {% if friends %}
    <ul class="friend-call-list">
        {% for f in friends %}
        <li>
            <div class="friend-entry">
                <img src="{{ url_for('static', filename='avatars/' + (f.profile_picture or 'default-avatar.png')) }}"
                    alt="Avatar">
                <span>{{ f.username }}</span>
                <button class="call-button" onclick="startCall({{ f.id }}, '{{ f.username }}')">📞 Call</button>

            </div>
        </li>
        {% endfor %}
    </ul>
    {% else %}
    <p>You have no Fwendth yet 😢</p>
    {% endif %}
</div>
<script>
    function startCall(friendId, friendName) {
        fetch(`/call/${friendId}`, { method: 'POST' })
            .then(res => res.json())
            .then(data => {
                const roomId = data.room_id;
                alert(`📞 Calling ${friendName}...`);
                const interval = setInterval(() => {
                    fetch(`/call_status/${friendId}`)
                        .then(res => res.json())
                        .then(status => {
                            if (status.accepted === true) {
                                clearInterval(interval);
                                window.location.href = `/call_room/${status.room_id}`;
                            } else if (status.accepted === false || status.active === false) {
                                clearInterval(interval);
                                alert("❌ Call declined or ended.");
                            }
                        });
                }, 3000);
            });
    }

    function checkIncomingCall() {
        fetch("/check_call")
            .then(res => res.json())
            .then(data => {
                if (data.caller && data.accepted === null) {
                    if (confirm(`📞 Incoming call from ${data.caller}. Accept?`)) {
                        fetch(`/accept_call/${data.caller_id}`, { method: "POST" })
                            .then(res => res.json())
                            .then(data => {
                                if (data.redirect) {
                                    window.location.href = data.redirect;
                                }
                            });
                    } else {
                        fetch(`/decline_call/${data.caller_id}`, { method: "POST" })
                            .then(() => alert("❌ Call declined"));
                    }
                }
            });
    }

    setInterval(checkIncomingCall, 5000);
</script>



{% endblock %}
