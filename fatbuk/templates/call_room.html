{% extends "base.html" %}
{% block title %}Call Room{% endblock %}
{% block content %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/call.css') }}">

<div class="call-container">
    <h2>🔊 You’re in a Call Room</h2>
    <p>Room ID: <code id="roomDisplay">{{ room_id }}</code></p>

    <audio id="localAudio" autoplay muted controls></audio>
    <audio id="remoteAudio" autoplay controls></audio>

    <p id="status">Waiting for connection...</p>
</div>

<script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>

<script>
    const socket = io();
    const room = "{{ room_id }}";
    const isCaller = window.location.hash === "#caller"; // only caller needs mic
    const localAudio = document.getElementById("localAudio");
    const remoteAudio = document.getElementById("remoteAudio");
    const status = document.getElementById("status");

    let localStream = null;
    let peerConnection = null;

    console.log("🔁 Joining room:", room, "| Caller:", isCaller);

    // Join the room immediately
    socket.emit('join', { room });

    socket.on('new-user', () => {
        if (isCaller) {
            console.log("Creating offer as initiator");
            createPeerConnection(true);
        }
    });

    socket.on('signal', data => {
        console.log("📥 Received signal:", data);

        if (!peerConnection) createPeerConnection(false);

        if (data.sdp) {
            peerConnection.setRemoteDescription(new RTCSessionDescription(data.sdp)).then(() => {
                if (data.sdp.type === 'offer') {
                    peerConnection.createAnswer().then(answer => {
                        peerConnection.setLocalDescription(answer);
                        socket.emit('signal', { sdp: answer, room });
                    });
                }
            });
        }

        if (data.candidate) {
            peerConnection.addIceCandidate(new RTCIceCandidate(data.candidate));
        }
    });

    function createPeerConnection(initiator) {
        console.log("📡 Creating PeerConnection");
        peerConnection = new RTCPeerConnection();

        if (localStream) {
            localStream.getTracks().forEach(track => {
                peerConnection.addTrack(track, localStream);
            });
        }

        peerConnection.onicecandidate = event => {
            if (event.candidate) {
                console.log("📤 Sending ICE candidate");
                socket.emit('signal', { candidate: event.candidate, room });
            }
        };

        peerConnection.ontrack = event => {
            console.log("🔊 Received remote stream");
            remoteAudio.srcObject = event.streams[0];
            status.innerText = "✅ Connected!";
        };

        if (initiator) {
            peerConnection.createOffer().then(offer => {
                peerConnection.setLocalDescription(offer);
                socket.emit('signal', { sdp: offer, room });
            });
        }
    }

    // Try to access mic
    navigator.mediaDevices.getUserMedia({ audio: true }).then(stream => {
        console.log("🎙️ Microphone access granted");
        localStream = stream;
        localAudio.srcObject = stream;
        status.innerText = "🎤 You can speak in the call";

        // If not caller, still need to join/create connection now that we have stream
        if (!isCaller && !peerConnection) {
            createPeerConnection(false);
        }

    }).catch(err => {
        console.warn("🎧 Mic not available — listen-only mode");
        status.innerText = "🎧 Listen-only mode (no mic)";
        createPeerConnection(false); // still listen even without mic
    });
</script>

{% endblock %}
