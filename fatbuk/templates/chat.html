{% extends "base.html" %}

{% block title %}Chat with {{ friend.username }}{% endblock %}

{% block content %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/messages.css') }}">

<div class="chat-container">
    <div class="chat-header">
        <h3>Chat with {{ friend.username }}</h3>
    </div>

    <div class="chat-box" id="chat-box">
        {% for msg in messages %}
        <div class="chat-message {% if msg.sender_id == session['user_id'] %}me{% else %}them{% endif %}">
            <span class="author">{{ msg.sender.username }}:</span> {{ msg.content }}
        </div>
        {% endfor %}
    </div>

    <form method="POST" class="chat-input">
        <input type="text" name="message" placeholder="Type your message..." required>
        <button type="submit">Send</button>
    </form>
</div>

<script>
    window.onload = () => {
        const box = document.getElementById("chat-box");
        box.scrollTop = box.scrollHeight;
    };
</script>
{% endblock %}
